<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE GAUNTLET // MASTER ENGINE</title>
    <style>
        :root { 
            --primary: #ff4d4d; 
            --bg: #111116; 
            --text: #f4f4f4; 
            --card-bg: #1c1c24;
            --success: #2e7d32;
            --error: #d32f2f; 
            --captcha-blue: #1a73e8;
        }
        
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        
        #quiz-card { 
            width: 100%; 
            max-width: 600px; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            position: relative;
            border: 1px solid #333;
            z-index: 10;
        }
        
        .meta { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 800; 
            color: #777; 
            margin-bottom: 30px; 
            font-size: 0.75rem; 
            letter-spacing: 1px; 
        }
        
        .question-text { 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin-bottom: 30px; 
            line-height: 1.3; 
        }
        
        .options { 
            display: grid; 
            gap: 12px; 
            position: relative;
        }
        
        button { 
            background: #2a2a35; 
            border: 2px solid #444; 
            color: var(--text);
            padding: 16px; 
            font-size: 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: border-color 0.2s, background-color 0.2s; 
            font-weight: 600; 
            text-align: left; 
            position: relative;
            will-change: transform;
        }
        
        button:hover { 
            border-color: var(--primary); 
            background: #332226; 
        }
        
        .trigger-link { 
            color: var(--primary); 
            text-decoration: underline; 
            cursor: pointer; 
            font-weight: 900; 
        }
        
        /* High-fidelity Feedback Overlays */
        #feedback-screen { 
            position: fixed; 
            inset: 0; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 4rem; 
            font-weight: 900; 
            z-index: 200; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #feedback-screen.show { opacity: 1; }
        
        /* Death Screen */
        #death-screen { 
            position: fixed; 
            inset: 0; 
            background: var(--error); 
            color: white; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 500; 
        }

        #death-title {
            font-size: 4.5rem; 
            font-weight: 900; 
            letter-spacing: 1px;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #death-actions {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        #death-actions button {
            background: white;
            color: var(--error);
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 800;
        }

        #death-actions button:hover {
            background: #f4f4f4;
            transform: translateY(-2px);
        }

        /* Simulated Rage Ad Popups */
        .fake-popup {
            position: absolute;
            width: 280px;
            background: #fff;
            color: #000;
            border: 3px solid #000;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
            font-family: 'Arial', sans-serif;
            z-index: 1000;
            padding: 10px;
        }
        .fake-popup-header {
            background: #000080;
            color: white;
            padding: 4px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fake-popup-close {
            background: #eee;
            color: #000;
            border: 1px solid #000;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 14px;
            cursor: pointer;
            font-size: 10px;
        }
        .fake-popup-body {
            padding: 15px 5px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        .fake-popup-btn {
            background: #ccc;
            border: 1px solid #444;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 12px;
        }

        /* CAPTCHA Styling */
        #captcha-container {
            display: none;
            background: white;
            color: #333;
            border: 1px solid #ccc;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .captcha-header { background: var(--captcha-blue); color: white; padding: 20px; margin-bottom: 15px; }
        .captcha-header h2 { margin: 0; font-size: 1.4rem; }
        .captcha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; height: 350px; }
        .captcha-cell { background-image: url('https://i.imgur.com/CEjOtYQ_d.webp?maxwidth=760&fidelity=grand'); background-size: 300% 300%; cursor: pointer; position: relative; }
        .c-0 { background-position: 0% 0%; } .c-1 { background-position: 50% 0%; } .c-2 { background-position: 100% 0%; }
        .c-3 { background-position: 0% 50%; } .c-4 { background-position: 50% 50%; } .c-5 { background-position: 100% 50%; }
        .c-6 { background-position: 0% 100%; } .c-7 { background-position: 50% 100%; } .c-8 { background-position: 100% 100%; }
        .captcha-cell.selected { box-shadow: inset 0 0 0 3px var(--captcha-blue); }
        .captcha-cell.selected::after { content: '✓'; position: absolute; top: 5px; left: 5px; background: var(--captcha-blue); color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .captcha-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .captcha-verify-btn { background: var(--captcha-blue); color: white; border: none; padding: 12px 24px; font-weight: 700; cursor: pointer; }

        #rage-timer {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 900;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

    let masterAudioTrack = null;
    let buttonPositions = []; 

    function initGlobalSoundEngine() {
        if (!masterAudioTrack) {
            masterAudioTrack = new Audio();
            // INTEGRATED: Verified structured jsDelivr CDN streaming reference loop
            masterAudioTrack.src = "https://cdn.jsdelivr.net/gh/aCrazyQuasar/project-music@main/virtualinsanity_spotdown.org.mp3";
            masterAudioTrack.loop = true;
            masterAudioTrack.preload = "auto";
        }
    }

    function forceUnlockAudio() {
        initGlobalSoundEngine();
        masterAudioTrack.volume = 0.01;
        masterAudioTrack.play()
            .then(() => {
                masterAudioTrack.pause();
                masterAudioTrack.currentTime = 0;
                alert("Audio Pipeline Successfully Forced Open inside W3S Sandbox.");
            })
            .catch(e => alert("Click screen directly first, then try again: " + e));
    }

    function startGame(mode) {
        currentMode = mode;
        isLocked = false;
        initGlobalSoundEngine();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('captcha-container').style.display = 'none';
        document.getElementById('rage-timer').style.display = 'none';
        clearInterval(rageTimerInterval);
        clearPopups();
        document.onmousemove = null;

        if (masterAudioTrack) {
            masterAudioTrack.pause();
            masterAudioTrack.currentTime = 0;
        }

        if (mode === 'part2') {
            document.getElementById('captcha-container').style.display = 'block';
            document.querySelectorAll('.captcha-cell').forEach(c => c.classList.remove('selected'));
        } else if (mode === 'part3') {
            currentQuestions = part3;
            document.getElementById('game-ui').style.display = 'block';
            loadQuestion();
        } else {
            currentQuestions = part1;
            document.getElementById('game-ui').style.display = 'block';
            loadQuestion();
        }
    }

    function toggleCaptchaTile(element) {
        element.classList.toggle('selected');
    }

    function verifyCaptcha() {
        document.getElementById('captcha-container').style.display = 'none';
        currentQuestions = part2;
        document.getElementById('game-ui').style.display = 'block';
        loadQuestion();
    }

    function resetDeathScreenAnimations() {
        document.getElementById('death-screen').style.display = 'none';
        document.getElementById('death-title').style.opacity = '0';
        document.getElementById('death-title').style.transform = 'scale(0.9)';
        document.getElementById('death-actions').style.opacity = '0';
        document.getElementById('death-actions').style.transform = 'translateY(20px)';
    }

    function retry() {
        resetDeathScreenAnimations();
        lives = 3; 
        currentQuestion = 0; 
        isLocked = false;
        document.getElementById('lives-display').innerText = "SANITY: 3"; 
        startGame(currentMode);
    }

    function goToMainMenu() {
        resetDeathScreenAnimations();
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('captcha-container').style.display = 'none';
        document.getElementById('rage-timer').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
        clearInterval(rageTimerInterval);
        clearPopups();
        document.onmousemove = null;
        lives = 3;
        currentQuestion = 0;
        currentMode = '';
        isLocked = false;
        document.getElementById('lives-display').innerText = "SANITY: 3";

        if (masterAudioTrack) {
            masterAudioTrack.pause();
            masterAudioTrack.currentTime = 0;
        }
    }

    function showFeedback(text, isCorrect) {
        const fb = document.getElementById('feedback-screen');
        fb.innerText = text;
        fb.style.backgroundColor = isCorrect ? 'var(--success)' : 'var(--error)';
        fb.classList.add('show');
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => fb.classList.remove('show'), 600);
    }

    function clearPopups() {
        popups.forEach(p => p.remove());
        popups = [];
    }

    function spawnFakePopup() {
        const popup = document.createElement('div');
        popup.className = 'fake-popup';
        popup.style.left = Math.random() * (window.innerWidth - 300) + 'px';
        popup.style.top = Math.random() * (window.innerHeight - 200) + 'px';
        
        popup.innerHTML = `
            <div class="fake-popup-header">
                <span>SYSTEM WARNING v4.11</span>
                <div class="fake-popup-close" onclick="triggerPopupPenalty(event)">X</div>
            </div>
            <div class="fake-popup-body">
                <p>Your browser memory leak is running out of space!</p>
                <button class="fake-popup-btn" onclick="triggerPopupPenalty(event)">Optimize Now</button>
            </div>
        `;
        document.body.appendChild(popup);
        popups.push(popup);
    }

    function triggerPopupPenalty(e) {
        e.stopPropagation();
        if(!isLocked) wrong();
    }

    function loadQuestion() {
        const q = currentQuestions[currentQuestion];
        if (!q) return;
        
        isLocked = false;
        document.onmousemove = null;
        clearPopups();
        clearInterval(rageTimerInterval);
        document.getElementById('rage-timer').style.display = 'none';
        buttonPositions = []; 
        
        // SYNCED AUDIO DROPS: Virtual Insanity hits exactly at Question 2 (Index 1)
        if (masterAudioTrack && currentMode === 'part3') {
            if (currentQuestion === 1) { 
                masterAudioTrack.volume = 0.35;
                masterAudioTrack.play().catch(err => console.log("Sandbox error bypassed: ", err));
            }
        }
        
        document.getElementById('question').innerHTML = q.q;
        document.getElementById('score-display').innerText = `${(currentQuestion + 1).toString().padStart(2, '0')} / 40`;
        const optEl = document.getElementById('options');
        optEl.innerHTML = '';
        
        if (q.behavior === "fake-timer") {
            const timerDisplay = document.getElementById('rage-timer');
            timerDisplay.style.display = 'block';
            let timeLeft = 2.00;
            timerDisplay.innerText = timeLeft.toFixed(2);
            rageTimerInterval = setInterval(() => {
                timeLeft -= 0.07;
                if(timeLeft <= 0) {
                    clearInterval(rageTimerInterval);
                    if(!isLocked) wrong();
                } else {
                    timerDisplay.innerText = timeLeft.toFixed(2);
                }
            }, 70);
        }

        if (q.behavior === "spawn-ad") {
            for(let i=0; i<4; i++) spawnFakePopup();
        }

        q.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.innerText = opt;
            buttonPositions.push({ x: 0, y: 0 });
            
            if(q.behavior === "color-bait") {
                const colors = ["#d32f2f", "#1a73e8", "#e65100", "#2e7d32"];
                b.style.backgroundColor = colors[i];
                b.style.color = "#fff";
            }
            
            b.onclick = () => { 
                if (isLocked) return;
                if (i === q.correct) next(); else wrong(); 
            };
            optEl.appendChild(b);
        });

        const trigger = document.getElementById('hidden-trigger');
        if(q.interactive === "hidden-button" && trigger) {
            trigger.onclick = () => { if(!isLocked) next(); };
        }
        
        const sd = document.getElementById('lives-display');
        if (q.interactive === "hover-sanity-trap") {
            sd.onmouseover = () => { if(!isLocked) wrong(); };
        } else {
            sd.onmouseover = (q.interactive === "hover-sanity") ? () => { if(!isLocked) { next(); sd.onmouseover = null; } } : null;
        }
        
        const sc = document.getElementById('score-display');
        sc.style.cursor = (q.interactive === "click-score") ? "pointer" : "default";
        sc.onclick = (q.interactive === "click-score") ? () => { if(!isLocked) next(); } : null;

        // FIXED INTERACTION SYSTEM: Hardware-accelerated translate3d tracking matrix arrays
        if (q.behavior === "flee") {
            document.onmousemove = (e) => {
                const buttons = optEl.querySelectorAll('button');
                buttons.forEach((btn, index) => {
                    const rect = btn.getBoundingClientRect();
                    const btnX = rect.left + rect.width / 2;
                    const btnY = rect.top + rect.height / 2;
                    
                    const dist = Math.hypot(e.clientX - btnX, e.clientY - btnY);
                    
                    if (dist < 140) {
                        const angle = Math.atan2(btnY - e.clientY, btnX - e.clientX);
                        const force = (140 - dist) * 0.95; 
                        
                        buttonPositions[index].x += Math.cos(angle) * force;
                        buttonPositions[index].y += Math.sin(angle) * force;
                        
                        buttonPositions[index].x = Math.max(-250, Math.min(buttonPositions[index].x, 250));
                        buttonPositions[index].y = Math.max(-200, Math.min(buttonPositions[index].y, 200));
                        
                        btn.style.transform = `translate3d(${buttonPositions[index].x}px, ${buttonPositions[index].y}px, 0)`;
                    }
                });
            };
        }
    }

    function next() { 
        if (isLocked) return;
        isLocked = true;
        clearInterval(rageTimerInterval);
        showFeedback("CORRECT", true);
        
        setTimeout(() => {
            currentQuestion++; 
            if(currentQuestion >= currentQuestions.length) {
                alert("YOU SURVIVED THE MASTER GAUNTLET.");
                goToMainMenu();
            } else {
                loadQuestion();
            }
        }, 250);
    }
    
    function wrong() { 
        if (isLocked) return;
        isLocked = true;
        clearInterval(rageTimerInterval);
        showFeedback("WRONG", false);
        lives--; 
        document.getElementById('lives-display').innerText = "SANITY: " + lives; 
        
        if(lives <= 0) {
            setTimeout(() => {
                clearPopups();
                document.onmousemove = null;
                if (masterAudioTrack) masterAudioTrack.pause();

                const ds = document.getElementById('death-screen');
                const title = document.getElementById('death-title');
                const actions = document.getElementById('death-actions');
                
                ds.style.display = 'flex';
                setTimeout(() => {
                    title.style.opacity = '1';
                    title.style.transform = 'scale(1)';
                }, 100);
                
                setTimeout(() => {
                    actions.style.opacity = '1';
                    actions.style.transform = 'translateY(0)';
                    isLocked = false;
                }, 1000); 
            }, 600);
        } else {
            setTimeout(loadQuestion, 250); 
        }
    }
</script>
</body>
</html>
